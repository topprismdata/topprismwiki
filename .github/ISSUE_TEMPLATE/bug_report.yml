name: Bug report
description: Report a reproducible Topprismwiki problem with redacted diagnostics.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private chat, business documents, Vault pages, credentials,
        raw model output, or complete user paths. Security issues must use SECURITY.md.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private evidence, credentials, identifiers and unredacted paths.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "commit hash or release"
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Error code
      placeholder: "for example REVIEW_FILE_MISSING"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version and relevant doctor results only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide synthetic or fully redacted commands and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Redacted diagnosis
      description: Paste the safe output from diagnose, not raw Workspace files.
    validations:
      required: true
